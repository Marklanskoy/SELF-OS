function lineChart(points){const items=points.map((d,i)=>({x:35+(i*(590/(Math.max(points.length-1,1)))),y:165-((d.val-1)/9)*132,val:d.val,date:d.date})).filter(p=>Number.isFinite(p.val));if(!items.length)return blank('chart','Когда появятся записи состояния, здесь будет график.');const poly=items.map(p=>`${p.x},${p.y}`).join(' ');const labels=points.map((p,i)=>`<text x="${35+i*(590/Math.max(points.length-1,1))}" y="192" font-size="11" fill="var(--faint)" text-anchor="middle">${esc(new Date(p.date+'T12:00:00').toLocaleDateString('ru-RU',{day:'numeric',month:'short'}))}</text>`).join('');return `<div class="chart-wrap"><svg class="line-chart" viewBox="0 0 660 212" role="img" aria-label="График настроения по дням"><line x1="35" y1="33" x2="625" y2="33" stroke="var(--line)" stroke-dasharray="4 5"/><line x1="35" y1="99" x2="625" y2="99" stroke="var(--line)" stroke-dasharray="4 5"/><line x1="35" y1="165" x2="625" y2="165" stroke="var(--line)"/><text x="18" y="37" font-size="11" fill="var(--faint)" text-anchor="middle">10</text><text x="18" y="103" font-size="11" fill="var(--faint)" text-anchor="middle">5</text><text x="18" y="169" font-size="11" fill="var(--faint)" text-anchor="middle">1</text>${items.length>1?`<polyline points="${poly}" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>`:''}${items.map(p=>`<circle cx="${p.x}" cy="${p.y}" r="5" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"><title>${esc(shortDate(p.date))}: ${p.val}/10</title></circle>`).join('')}${labels}</svg></div>`}
function focusMinutesByDay(){const days=pastDays(7),max=Math.max(25,...days.map(d=>db.focusSessions.filter(s=>s.date===d).reduce((a,s)=>a+toMinutes(s.seconds),0)));return `<div class="hist-bars">${days.map(d=>{const val=db.focusSessions.filter(s=>s.date===d).reduce((a,s)=>a+toMinutes(s.seconds),0);const height=Math.max(3,Math.round(val/max*104));return `<div class="bar-col" title="${esc(shortDate(d))}: ${val} мин"><div class="bar" style="height:${height}px"></div><span>${esc(new Date(d+'T12:00:00').toLocaleDateString('ru-RU',{weekday:'short'}))}</span></div>`}).join('')}</div>`}

function renderPatterns(){const days=pastDays(30),daily=days.map(d=>({date:d,check:latestByDay(d),tasks:tasksForDay(d)})),withCheck=daily.filter(x=>x.check),logCount=db.checkins.length;const patterns=[];if(withCheck.length>=6){const low=withCheck.filter(x=>x.check.energy<=4),high=withCheck.filter(x=>x.check.energy>=7);if(low.length>=2&&high.length>=2){const lp=low.flatMap(x=>x.tasks),hp=high.flatMap(x=>x.tasks);if(lp.length>=2&&hp.length>=2){patterns.push(`<strong>Энергия и выполнение задач</strong><p>В дни с низкой энергией выполнено ${pct(lp.filter(t=>t.done).length,lp.length)}% запланированных задач (${lp.length} шт.), с высокой — ${pct(hp.filter(t=>t.done).length,hp.length)}% (${hp.length} шт.). Это совпадение в записях, не доказательство причины.</p>`);}}const stressAvg=avg(withCheck.map(x=>x.check.stress));patterns.push(`<strong>Средний отмеченный стресс</strong><p>${stressAvg.toFixed(1)} из 10 за ${withCheck.length} дней с записями за последний месяц. Сравнивай показатель с собственными ощущениями, а не с чужими нормами.</p>`)}if(db.focusSessions.length>=3){const recent=db.focusSessions.filter(s=>days.includes(s.date));if(recent.length>=3){const inter=recent.reduce((n,s)=>n+(Number(s.interruptions)||0),0);patterns.push(`<strong>Возвращение внимания</strong><p>За ${recent.length} сессий ты отметил ${inter} отвлечений и всё равно завершил эти сессии. Внимание можно тренировать без требования идеальной концентрации.</p>`)}}if(!patterns.length)return blank('spark','Пока мало наблюдений. Записывай состояние, действия и фокус в течение нескольких дней — затем появятся осторожные, проверяемые выводы.');return `<div class="stack">${patterns.map(s=>`<div class="pattern">${ic('spark',18)}<div>${s}</div></div>`).join('')}</div>`}

if(view.modal==='goal')return wrapModal('Новая цель',`<form class="form-grid" data-form="goal"><div class="field"><label for="goal-title">Какой результат хочешь получить?</label><input class="input" id="goal-title" name="title" maxlength="120" placeholder="Например: выпустить первую версию проекта" required autofocus></div><div class="field"><label for="goal-deadline">Срок (необязательно)</label><input class="input" type="date" name="deadline" id="goal-deadline"></div><div class="field"><label for="goal-notes">Почему это важно? (необязательно)</label><textarea class="textarea" id="goal-notes" name="notes" maxlength="500" placeholder="Главная причина, результат, критерий успеха"></textarea></div><div class="form-actions"><button class="btn btn-ghost" type="button" data-action="close-modal">Отмена</button><button class="btn btn-primary" type="submit">Создать цель</button></div></form>`);
if(view.modal==='habit')return wrapModal('Новая привычка',`<form class="form-grid" data-form="habit"><div class="field"><label for="habit-title">Что хочешь делать регулярно?</label><input class="input" id="habit-title" name="title" maxlength="110" placeholder="Например: читать по утрам" required autofocus></div><div class="field"><label for="habit-cue">Когда выполнять?</label><input class="input" id="habit-cue" name="cue" maxlength="100" placeholder="Например: после завтрака"></div><div class="field"><label for="habit-minimum">Минимальная версия привычки</label><input class="input" id="habit-minimum" name="minimum" maxlength="100" placeholder="Например: 2 страницы"></div><div class="form-actions"><button class="btn btn-ghost" type="button" data-action="close-modal">Отмена</button><button class="btn btn-primary" type="submit">Создать привычку</button></div></form>`);
if(view.modal==='decision')return wrapModal('Новое решение',`<form class="form-grid" data-form="decision"><div class="field"><label for="decision-title">Какой выбор нужно сделать?</label><input class="input" id="decision-title" name="title" maxlength="160" placeholder="Например: запускать ли проект сейчас?" required autofocus></div><div class="field"><label for="decision-context">Контекст и известные факты</label><textarea class="textarea" id="decision-context" name="context" maxlength="1300" placeholder="Что мне известно, а что пока только предположение?"></textarea></div><div class="field"><label for="decision-options">Возможные варианты</label><textarea class="textarea" id="decision-options" name="options" maxlength="1000" placeholder="1. ...&#10;2. ...&#10;3. ..."></textarea></div><div class="field"><label for="decision-risks">Риски и последствия</label><textarea class="textarea" id="decision-risks" name="risks" maxlength="1000" placeholder="Чем рискую? Насколько решение обратимо?"></textarea></div><div class="field"><label for="decision-choice">Предварительный выбор и причина</label><textarea class="textarea" id="decision-choice" name="choice" maxlength="1000" placeholder="Что выбираю и почему?"></textarea></div><div class="field"><label for="decision-reviewDate">Когда проверить результат? (необязательно)</label><input class="input" type="date" name="reviewDate" id="decision-reviewDate"></div><div class="form-actions"><button class="btn btn-ghost" type="button" data-action="close-modal">Отмена</button><button class="btn btn-primary" type="submit">Сохранить решение</button></div></form>`,true);
if(view.modal==='decision-view'){const d=db.decisions.find(x=>x.id===view.viewId);if(!d)return '';return wrapModal('Карточка решения',`<h2 style="margin-bottom:18px">${esc(d.title)}</h2><div class="detail-grid">${[['Дата',shortDate(d.date)],['Статус',d.reviewed?'Пересмотрено':'Ожидает оценки'],['Факты и контекст',d.context],['Варианты',d.options],['Риски',d.risks],['Предварительный выбор',d.choice],['Пересмотр',d.reviewDate?shortDate(d.reviewDate):'Не назначен'],['Результат',d.outcome],['Извлечённый урок',d.lesson]].map(([key,val])=>`<div><div class="detail-label">${esc(key)}</div><div class="detail-value">${val?safeText(val):'<span class="faint">Не заполнено</span>'}</div></div>`).join('')}</div><div class="form-actions"><button class="btn btn-primary" data-action="review-decision" data-id="${esc(d.id)}">${ic('edit',16)} Пересмотреть</button></div>`,true)}
if(view.modal==='decision-review'){const d=db.decisions.find(x=>x.id===view.reviewId);if(!d)return '';return wrapModal('Пересмотр решения',`<p class="small muted" style="margin-bottom:18px">${esc(d.title)}</p><form class="form-grid" data-form="decision-review"><input type="hidden" name="id" value="${esc(d.id)}"><div class="field"><label for="review-outcome">Что получилось на практике?</label><textarea class="textarea" id="review-outcome" name="outcome" maxlength="1300" placeholder="Результат, факты, неожиданные обстоятельства">${esc(d.outcome||'')}</textarea></div><div class="field"><label for="review-lesson">Что можно извлечь из результата?</label><textarea class="textarea" id="review-lesson" name="lesson" maxlength="1100" placeholder="Было ли решение разумным по известной тогда информации?">${esc(d.lesson||'')}</textarea></div><div class="form-actions"><button class="btn btn-ghost" type="button" data-action="close-modal">Отмена</button><button class="btn btn-primary" type="submit">Сохранить вывод</button></div></form>`)}
if(view.modal==='reset')return wrapModal('Удаление всех данных',`<div class="warning-box"><strong>Внимание:</strong> все локальные записи, привычки, цели, решения и тренировки будут удалены. Без резервной копии восстановить их нельзя.</div><form data-form="reset" class="form-grid" style="margin-top:17px"><div class="field"><label for="reset-confirm">Напиши УДАЛИТЬ, чтобы подтвердить</label><input class="input" id="reset-confirm" name="confirmation" autocomplete="off" placeholder="УДАЛИТЬ" required></div><div class="form-actions"><button type="button" class="btn btn-ghost" data-action="close-modal">Отмена</button><button type="submit" class="btn btn-danger">Удалить всё</button></div></form>`);
if(view.modal==='stop'){const type=stopTypes[view.stopType];if(view.stopStage===0)return wrapModal('СТОП — осознанная пауза',`<p class="small muted" style="margin-bottom:16px">Какая ситуация сейчас требует внимания? Этот инструмент не подавляет эмоции — он помогает выбрать следующую реакцию.</p><form data-form="stop-start" class="form-grid"><div class="type-grid">${Object.entries(stopTypes).map(([key,x])=>`<button class="type-btn ${view.stopType===key?'selected':''}" type="button" data-action="select-stop" data-type="${key}">${ic(x.icon,18)} ${esc(x.name)}</button>`).join('')}</div><div class="field"><div class="range-row"><label for="stop-before">Насколько сильное переживание или желание?</label><span class="range-value" data-range-value="before">${view.stopBefore}</span></div><input class="range-track" id="stop-before" name="before" type="range" min="1" max="10" value="${view.stopBefore}"></div><div class="field"><label for="stop-context">Что произошло? (необязательно)</label><textarea class="textarea" id="stop-context" name="context" maxlength="600" placeholder="Одна фраза о ситуации">${esc(view.stopContext)}</textarea></div><div class="form-actions"><button class="btn btn-primary" type="submit">Начать практику ${ic('arrow',16)}</button></div></form>`);return wrapModal(type.name,`<div class="chip accent-bg" style="margin-bottom:15px">${ic('stop',14)} 3 коротких шага</div><div class="stop-steps">${type.steps.map((step,i)=>`<div class="stop-step"><span class="step-num">${i+1}</span><p>${esc(step)}</p></div>`).join('')}</div><form data-form="stop-finish" class="form-grid" style="margin-top:20px"><div class="field"><div class="range-row"><label for="stop-after">Какова интенсивность сейчас?</label><span class="range-value" data-range-value="after">${view.stopBefore}</span></div><input class="range-track" id="stop-after" name="after" type="range" min="1" max="10" value="${view.stopBefore}"></div><div class="field"><label for="stop-next">Какое действие выбираешь? (необязательно)</label><textarea class="textarea" id="stop-next" name="nextAction" maxlength="600" placeholder="Например: вернуться к задаче на 5 минут"></textarea></div><div class="form-actions"><button type="button" class="btn btn-ghost" data-action="stop-back">Назад</button><button class="btn btn-primary" type="submit">${ic('check',16)} Завершить и сохранить</button></div></form>`)}return ''}
function formatTimer(seconds){let s=Math.max(0,Math.floor(seconds));return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`}
function finishFocus(auto=false){if(db.focus.status==='idle')return;const seconds=Math.min(Math.max(0,focusElapsed()),db.focus.duration);const f=db.focus;if(seconds>=60){const task=db.tasks.find(t=>t.id===f.taskId);db.focusSessions.push({id:uid(),date:today(),seconds,interruptions:f.interruptions||0,taskTitle:task?.title||'',endedAt:Date.now()});}db.focus={status:'idle',duration:f.duration,elapsed:0,startAt:0,interruptions:0,taskId:f.taskId||''};save();render();toast(seconds>=60?(auto?'Сессия завершена и сохранена!':'Сессия сохранена'):'Сессия короче одной минуты не сохраняется')}
function updateTimerUi(){if(!document.getElementById('timer-clock'))return;if(db.focus.status==='running'&&focusElapsed()>=db.focus.duration){finishFocus(true);return}document.getElementById('timer-clock').textContent=formatTimer(focusRemaining());const status=document.getElementById('timer-status');if(status)status.textContent=db.focus.status==='running'?'В процессе':db.focus.status==='paused'?'Пауза':'Готов к старту';const counter=document.getElementById('focus-interruptions');if(counter)counter.textContent=db.focus.interruptions}
function clickAction(action,el){const id=el.dataset.id;switch(action){
case 'navigate':go(el.dataset.to);break;
case 'toggle-more':view.more=!view.more;render();break;
case 'open-stop':view.stopStage=0;view.stopType='impulse';view.stopBefore=6;view.stopContext='';openModal('stop');break;
case 'close-modal':closeModal();break;
case 'skip-onboarding':db.prefs.onboarded=true;save();closeModal();break;
case 'add-goal-modal':openModal('goal');break;
case 'add-habit-modal':openModal('habit');break;
case 'add-decision-modal':openModal('decision');break;
case 'toggle-task':{const x=db.tasks.find(t=>t.id===id);if(!x)return;x.done=!x.done;x.completedAt=x.done?Date.now():null;save();render();break}
case 'delete-task':if(confirm('Удалить эту задачу?')){db.tasks=db.tasks.filter(t=>t.id!==id);save();render();toast('Задача удалена')}break;
case 'toggle-habit':if(isHabitDone(id))db.habitLogs=db.habitLogs.filter(x=>!(x.habitId===id&&x.date===today()));else db.habitLogs.push({id:uid(),habitId:id,date:today()});save();render();break;
case 'delete-habit':if(confirm('Удалить эту привычку и её историю отметок?')){db.habits=db.habits.filter(x=>x.id!==id);db.habitLogs=db.habitLogs.filter(x=>x.habitId!==id);save();render();toast('Привычка удалена')}break;
case 'toggle-goal':{const g=db.goals.find(x=>x.id===id);if(!g)return;g.done=!g.done;save();render();break}
case 'delete-goal':if(confirm('Удалить цель? Связанные задачи сохранятся без привязки.')){db.goals=db.goals.filter(x=>x.id!==id);db.tasks.forEach(x=>{if(x.goalId===id)x.goalId=''});save();render();toast('Цель удалена')}break;
case 'focus-duration':if(db.focus.status==='idle'){db.focus.duration=Number(el.dataset.minutes)*60;save();render()}break;
case 'focus-start':if(db.focus.status==='idle'){db.focus.status='running';db.focus.elapsed=0;db.focus.startAt=Date.now();db.focus.interruptions=0;db.focus.taskId=document.getElementById('focus-task')?.value||'';save();render();toast('Фокус-сессия началась')}break;
case 'focus-pause':if(db.focus.status==='running'){db.focus.elapsed=focusElapsed();db.focus.startAt=0;db.focus.status='paused';save();render()}break;
case 'focus-resume':if(db.focus.status==='paused'){db.focus.startAt=Date.now();db.focus.status='running';save();render()}break;
case 'focus-end':finishFocus();break;
case 'focus-reset':if(confirm('Сбросить текущую сессию без сохранения?')){const duration=db.focus.duration;db.focus={status:'idle',duration,elapsed:0,startAt:0,interruptions:0,taskId:''};save();render()}break;
case 'focus-distraction':if(db.focus.status!=='idle'){db.focus.interruptions++;save();updateTimerUi();toast('Отвлечение отмечено. Можно спокойно вернуться к делу.')}break;
case 'delete-focus':if(confirm('Удалить запись об этой фокус-сессии?')){db.focusSessions=db.focusSessions.filter(x=>x.id!==id);save();render()}break;
case 'view-decision':view.viewId=id;openModal('decision-view');break;
case 'review-decision':view.reviewId=id;openModal('decision-review');break;
case 'delete-decision':if(confirm('Удалить это решение и его результат?')){db.decisions=db.decisions.filter(x=>x.id!==id);save();render()}break;
case 'select-lesson':view.selectedLesson=Number(el.dataset.day);render();break;
case 'uncomplete-lesson':delete db.trainingCompleted[String(el.dataset.day)];save();render();break;
case 'select-stop':view.stopBefore=Number(document.querySelector('[name="before"]')?.value)||view.stopBefore;view.stopContext=document.querySelector('[name="context"]')?.value||'';view.stopType=el.dataset.type;render();break;
case 'stop-back':view.stopStage=0;render();break;
case 'export':exportData();break;
case 'import-click':document.getElementById('import-file')?.click();break;
case 'reset-modal':openModal('reset');break;
default:break}}
function exportData(){const payload={...db,exportedAt:new Date().toISOString(),application:'SELF OS 0.1'};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const anchor=document.createElement('a');anchor.href=url;anchor.download=`SELF_OS_backup_${today()}.json`;document.body.appendChild(anchor);anchor.click();anchor.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);toast('Резервная копия подготовлена')}
function importData(parsed){if(!parsed||parsed.version!==1)throw new Error('Неподдерживаемая версия резервной копии');const keys=['checkins','goals','tasks','habits','habitLogs','focusSessions','decisions','stopEvents'];for(const k of keys)if(!Array.isArray(parsed[k])||parsed[k].length>100000)throw new Error('Некорректная структура: '+k);if(!parsed.prefs||typeof parsed.prefs!=='object'||!parsed.trainingCompleted||typeof parsed.trainingCompleted!=='object')throw new Error('Отсутствуют обязательные поля');const clean=fresh();for(const k of keys)clean[k]=parsed[k].filter(v=>v&&typeof v==='object'&&!Array.isArray(v));clean.prefs={name:String(parsed.prefs.name||'').slice(0,42),focusSkill:Object.keys(skills).includes(parsed.prefs.focusSkill)?parsed.prefs.focusSkill:'attention',theme:['light','dark'].includes(parsed.prefs.theme)?parsed.prefs.theme:'dark',onboarded:true};clean.trainingCompleted=Object.fromEntries(Object.entries(parsed.trainingCompleted).filter(([k,v])=>Number(k)>=1&&Number(k)<=40&&v&&typeof v==='object').map(([k,v])=>[k,{completedAt:Number(v.completedAt)||Date.now(),reflection:String(v.reflection||'').slice(0,700)}]));clean.focus={...clean.focus};return clean}
function handleForm(e){const form=e.target.closest('form[data-form]');if(!form)return;e.preventDefault();const f=Object.fromEntries(new FormData(form).entries());const t=String(f.title||'').trim();const now=Date.now();switch(form.dataset.form){
case 'onboarding':db.prefs.name=String(f.name||'').trim().slice(0,42);db.prefs.focusSkill=skills[f.focusSkill]?f.focusSkill:'attention';db.prefs.onboarded=true;save();closeModal();toast('Добро пожаловать в SELF OS');break;
case 'settings':db.prefs.name=String(f.name||'').trim().slice(0,42);db.prefs.focusSkill=skills[f.focusSkill]?f.focusSkill:'attention';db.prefs.theme=['light','dark'].includes(f.theme)?f.theme:'dark';save();render();toast('Настройки сохранены');break;
case 'checkin':db.checkins.push({id:uid(),date:today(),createdAt:now,mood:clamp(f.mood,1,10),energy:clamp(f.energy,1,10),stress:clamp(f.stress,1,10),emotion:String(f.emotion||'').slice(0,60),note:String(f.note||'').trim().slice(0,700)});save();render();toast('Состояние записано');break;
case 'task':if(!t){toast('Введи название задачи');return}db.tasks.push({id:uid(),title:t.slice(0,140),date:/^\d{4}-\d{2}-\d{2}$/.test(f.date)?f.date:today(),goalId:db.goals.some(g=>g.id===f.goalId)?f.goalId:'',createdAt:now,done:false,completedAt:null});save();render();toast('Задача добавлена');break;
case 'goal':if(!t)return;db.goals.push({id:uid(),title:t.slice(0,120),deadline:/^\d{4}-\d{2}-\d{2}$/.test(f.deadline||'')?f.deadline:'',notes:String(f.notes||'').trim().slice(0,500),createdAt:now,done:false});save();closeModal();toast('Цель добавлена');break;
case 'habit':if(!t)return;db.habits.push({id:uid(),title:t.slice(0,110),cue:String(f.cue||'').trim().slice(0,100),minimum:String(f.minimum||'').trim().slice(0,100),createdAt:now,archived:false});save();closeModal();toast('Привычка добавлена');break;
case 'decision':if(!t)return;db.decisions.push({id:uid(),date:today(),createdAt:now,title:t.slice(0,160),context:String(f.context||'').trim().slice(0,1300),options:String(f.options||'').trim().slice(0,1000),risks:String(f.risks||'').trim().slice(0,1000),choice:String(f.choice||'').trim().slice(0,1000),reviewDate:/^\d{4}-\d{2}-\d{2}$/.test(f.reviewDate||'')?f.reviewDate:'',reviewed:false,outcome:'',lesson:''});save();closeModal();toast('Решение записано');break;
case 'decision-review':{const d=db.decisions.find(x=>x.id===f.id);if(!d)return;d.outcome=String(f.outcome||'').trim().slice(0,1300);d.lesson=String(f.lesson||'').trim().slice(0,1100);d.reviewed=true;d.reviewedAt=now;save();closeModal();toast('Результат решения сохранён');break}
case 'training':{const day=clamp(f.day,1,40);db.trainingCompleted[String(day)]={completedAt:now,reflection:String(f.reflection||'').trim().slice(0,700)};save();render();toast('Практика отмечена');break}
case 'stop-start':view.stopBefore=clamp(f.before,1,10);view.stopContext=String(f.context||'').trim().slice(0,600);view.stopStage=1;render();break;
case 'stop-finish':db.stopEvents.push({id:uid(),date:today(),createdAt:now,type:view.stopType,before:view.stopBefore,after:clamp(f.after,1,10),context:view.stopContext,nextAction:String(f.nextAction||'').trim().slice(0,600)});save();closeModal();toast('Практика завершена и записана');break;
case 'reset':if(String(f.confirmation||'').trim()!=='УДАЛИТЬ'){toast('Напиши УДАЛИТЬ точно как указано');return}db=fresh();db.prefs.onboarded=false;save();view.modal='onboarding';view.screen='home';view.more=false;render();toast('Локальные данные удалены');break;
default:break}}
// Event delegation keeps the page working after screens rerender.
document.addEventListener('click',e=>{const btn=e.target.closest('[data-action]');if(!btn)return;if(btn.closest('form')&&btn.type==='submit')return;const action=btn.dataset.action;if(!action)return;clickAction(action,btn)});
document.addEventListener('submit',handleForm);
document.addEventListener('input',e=>{const input=e.target;if(input.matches('input[type="range"][name]')){const field=input.name;const span=document.querySelector(`[data-range-value="${field}"]`);if(span)span.textContent=input.value}});
document.addEventListener('change',async e=>{if(e.target.id==='focus-task'&&db.focus.status==='idle'){db.focus.taskId=e.target.value;save();return}if(e.target.id!=='import-file')return;const file=e.target.files?.[0];if(!file)return;if(file.size>5*1024*1024){toast('Размер копии слишком большой (больше 5 МБ)');e.target.value='';return}try{const parsed=JSON.parse(await file.text());const incoming=importData(parsed);if(confirm('Восстановить резервную копию? Все текущие записи будут заменены.')){db=incoming;save();view.screen='home';view.more=false;view.modal=null;render();toast('Резервная копия восстановлена')}}catch(err){console.warn(err);toast('Не удалось импортировать: неверный формат копии')}e.target.value=''});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&view.modal&&view.modal!=='onboarding')closeModal()});
window.addEventListener('storage',e=>{if(e.key!==KEY||!e.newValue)return;try{const newer=JSON.parse(e.newValue);if(newer&&newer.version===1){db={...fresh(),...newer};render()}}catch(_){}});
setInterval(()=>{if(db.focus.status==='running'&&focusElapsed()>=db.focus.duration)finishFocus(true);else updateTimerUi()},1000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)updateTimerUi()});
if('serviceWorker' in navigator&&['https:','http:'].includes(location.protocol)){window.addEventListener('load',()=>{navigator.serviceWorker.register('./sw.js').catch(err=>console.warn('Offline support unavailable',err))})}
render();
})();

  </script>
